services:
  quarkus-db:
    container_name: quarkus-db
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - quarkus-db-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - quarkus-network

  redis:
    container_name: quarkus-redis
    image: redis:8.2.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - quarkus-network

volumes:
  quarkus-db-data:
  redis-data:

networks:
    quarkus-network:
      driver: bridge