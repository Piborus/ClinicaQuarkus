# Test configuration
# Disable Flyway migrations during tests
quarkus.flyway.migrate-at-start=false
quarkus.flyway.active=false

# Let DevServices configure the database automatically
# Do not specify URLs in test mode - DevServices will provide them

# Hibernate
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false
