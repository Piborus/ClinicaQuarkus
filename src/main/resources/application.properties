# ===============================
# Application
# ===============================
quarkus.application.name=clinica-api
quarkus.live-reload.enabled=true
quarkus.log.level=ERROR

# ===============================
# Security
# ===============================
mp.jwt.verify.publickey.location=classpath:publicVerificationKey.pem
quarkus.native.resources.includes=publicVerificationKey.pem,rsaPrivateKey.pem
smallrye.jwt.sign.key.location=classpath:rsaPrivateKey.pem
mp.jwt.verify.issuer=clinica-api
quarkus.smallrye-jwt.enabled=true
jwt.expiration.hours=${TEMPO_EXPIRACAO_APP:6}
quarkus.http.auth.proactive=false


# ===============================
# Datasource REACTIVE (runtime)
# ===============================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/quarkus-db
quarkus.datasource.username=postgres
quarkus.datasource.password=admin

# ===============================
# Datasource JDBC (APENAS Flyway)
# ===============================
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus-db

# ===============================
# Hibernate Reactive
# ===============================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=true

# ===============================
# Flyway
# ===============================
quarkus.flyway.active=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=clinica
quarkus.flyway.default-schema=clinica
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# ===============================
# OpenAPI
# ===============================
quarkus.smallrye-openapi.path=/swagger
