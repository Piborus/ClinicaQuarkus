# ===============================
# Application
# ===============================
quarkus.application.name=clinica-api
quarkus.http.port=${PORT:8080}
quarkus.live-reload.enabled=true
quarkus.log.level=${LOG_LEVEL:DEBUG}

# ===============================
# Security/JWT
# ===============================
# Localização das chaves PEM (arquivo no classpath para dev, override via env var em produção)
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY_LOCATION:META-INF/microprofile-jwt/privateKey.pem}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY_LOCATION:META-INF/microprofile-jwt/publicKey.pem}

mp.jwt.verify.issuer=${JWT_ISSUER:clinica-api}
quarkus.smallrye-jwt.enabled=true
jwt.expiration.minutes=${TEMPO_EXPIRACAO_APP:15}
quarkus.http.auth.proactive=false
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3003
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=true


# ===============================
# Datasource REACTIVE (runtime)
# ===============================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.reactive.url=postgresql://localhost:5432/${POSTGRES_DB}
quarkus.datasource.username=${POSTGRES_USER}
quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.datasource.reactive.max-size=20
quarkus.datasource.reactive.idle-timeout=PT5M

# ===============================
# Datasource JDBC (APENAS Flyway)
# ===============================
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/quarkus-db

# ===============================
# Hibernate Reactive
# ===============================
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=${HIBERNATE_LOG_SQL:true}
quarkus.log.category."org.hibernate".level=${HIBERNATE_LOG_LEVEL:DEBUG}

# ===============================
# Flyway
# ===============================
quarkus.flyway.active=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.schemas=clinica
quarkus.flyway.default-schema=clinica
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration

# ===============================
# OpenAPI
# ===============================
quarkus.smallrye-openapi.path=/swagger

# ===============================
# Redis
# ===============================
quarkus.redis.hosts=${REDIS_HOST}
refresh.token.ttl=${REDIS_TEMPO_REFRESH_TOKEN}
quarkus.redis.timeout=2s
quarkus.redis.connect-timeout=2s

# ===============================
# Mailer
# ===============================
quarkus.mailer.from=${MAILER_FROM}
quarkus.mailer.host=${MAILER_HOST}
quarkus.mailer.port=${MAILER_PORT:587}
quarkus.mailer.username=${MAILER_USERNAME}
quarkus.mailer.password=${MAILER_PASSWORD}
quarkus.mailer.start-tls=${MAILER_STARTTLS:REQUIRED}
quarkus.mailer.auth-methods=${MAILER_AUTH_METHODS:PLAIN LOGIN}
quarkus.mailer.mock=${MAILER_MOCK:false}

